<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>PorchWatch</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --panel-2: #1f252d; --line: #2a313b;
    --text: #e6e9ee; --muted: #8b95a3; --accent: #3d8bfd; --ok: #2fb872; --warn: #e8a33d; --rec: #e5484d;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; color: var(--muted); padding: 7px 12px; border-radius: 7px; cursor: pointer; font: inherit; }
  nav button.active { background: var(--panel-2); color: var(--text); }
  .pill { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.rec { background: var(--rec); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  section.tab { display: none; } section.tab.active { display: block; }
  .live { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
  @media (max-width: 900px) { .live { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .video { width: 100%; border-radius: var(--radius); background: #000; display: block; aspect-ratio: 16/9; object-fit: contain; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
  .btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 10px; cursor: pointer; font: inherit; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .stack > * + * { margin-top: 16px; }
  .log { font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); max-height: 220px; overflow: auto; white-space: pre-wrap; }
  .events { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .ev { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .ev img.main { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #000; cursor: zoom-in; }
  .ev .body { padding: 10px 12px; font-size: 13px; }
  .ev .plate { font: 700 18px ui-monospace, Consolas, monospace; letter-spacing: 2px; background: #f4f4f0; color: #111;
               border-radius: 4px; padding: 2px 8px; display: inline-block; }
  .ev .thumbs { display: flex; gap: 6px; margin-top: 8px; }
  .ev .thumbs img { height: 44px; border-radius: 4px; cursor: zoom-in; }
  .muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  a { color: var(--accent); }
  .settings { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; }
  @media (max-width: 800px) {
    .settings { grid-template-columns: 1fr; }
    .settings .side { display: flex; gap: 6px; overflow-x: auto; position: sticky; top: 52px; background: var(--bg); padding: 4px 0; z-index: 4; }
    .settings .side button { width: auto; white-space: nowrap; margin: 0; }
  }
  @media (max-width: 600px) {
    header { flex-wrap: wrap; gap: 6px 12px; padding: 8px 12px; }
    header nav { order: 3; width: 100%; }
    nav button { padding: 6px 9px; }
    main { padding: 12px; }
  }
  .settings .side button { display: block; width: 100%; text-align: left; margin-bottom: 4px; }
  .field { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .field:last-child { border-bottom: 0; }
  @media (max-width: 700px) { .field { grid-template-columns: 1fr; } }
  .field label { font-weight: 500; }
  .field .help { grid-column: 2; font-size: 12px; color: var(--muted); }
  @media (max-width: 700px) { .field .help { grid-column: 1; } }
  input[type=text], input[type=number], input[type=password], select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: inherit; width: 100%; max-width: 320px; }
  input[type=range] { width: 100%; max-width: 320px; accent-color: var(--accent); }
  .range-wrap { display: flex; align-items: center; gap: 10px; }
  .range-wrap output { font-variant-numeric: tabular-nums; min-width: 44px; color: var(--muted); }
  .switch { width: 20px; height: 20px; accent-color: var(--accent); }
  .savebar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
             padding: 12px 16px; display: flex; gap: 12px; align-items: center; margin: 16px -14px -14px; border-radius: 0 0 var(--radius) var(--radius); }
  .tag { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
  .field.zones { display: block; }
  .zone-wrap { position: relative; max-width: 800px; }
  .zone-wrap img { width: 100%; display: block; border-radius: 8px; background: #000; aspect-ratio: 16/9; }
  .zone-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .zone-tools { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; align-items: center; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 10; }
  .lightbox img { max-width: 95vw; max-height: 95vh; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel-2); border: 1px solid var(--line); padding: 10px 14px; border-radius: 8px; display: none; z-index: 20; }
  .err { color: var(--rec); }
</style>
</head>
<body>
<header>
  <h1>PorchWatch</h1>
  <nav>
    <button data-tab="live" class="active">Live</button>
    <button data-tab="events">Events</button>
    <button data-tab="recordings">Recordings</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="pill"><span class="dot" id="recdot"></span><span id="rectext">idle</span></div>
</header>

<main>
  <section class="tab active" id="tab-live">
    <div class="live">
      <div><img class="video" src="stream.mjpg" alt="Live camera view"></div>
      <div class="stack">
        <div class="card">
          <h2>Status</h2>
          <div class="kv" id="status"></div>
          <div id="error" class="err"></div>
        </div>
        <div class="card">
          <h2>Camera control</h2>
          <div class="pad">
            <button class="btn" data-ptz="zoom_out">Zoom −</button>
            <button class="btn" data-ptz="up">▲</button>
            <button class="btn" data-ptz="zoom_in">Zoom +</button>
            <button class="btn" data-ptz="left">◀</button>
            <button class="btn primary" data-ptz="home" title="Return home and resume auto-tracking">Home</button>
            <button class="btn" data-ptz="right">▶</button>
            <span></span>
            <button class="btn" data-ptz="down">▼</button>
            <span></span>
          </div>
          <div style="display:flex; gap:6px; margin-top:10px; flex-wrap:wrap">
            <button class="btn small" data-ptz="set_home">Set current view as home</button>
            <button class="btn small" id="pausebtn">Pause tracking</button>
          </div>
          <div style="border-top:1px solid var(--line); margin-top:12px; padding-top:10px">
            <label style="display:flex; align-items:center; gap:8px; font-weight:500">
              <input type="checkbox" class="switch" id="patrolchk"> Patrol (sweep left ↔ right)
            </label>
            <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap">
              <button class="btn small" data-ptz="set_patrol_left">Set as left edge</button>
              <button class="btn small" data-ptz="set_patrol_right">Set as right edge</button>
            </div>
          </div>
          <p class="muted" style="font-size:12px; margin:8px 0 0">Moving the camera manually pauses auto-tracking. Press Home to resume.</p>
        </div>
        <div class="card" id="audiocard" style="display:none">
          <h2>Audio</h2>
          <div style="display:flex; align-items:center; gap:10px">
            <div style="flex:1; height:10px; background:var(--panel-2); border-radius:5px; overflow:hidden">
              <div id="meter" style="height:100%; width:0; background:var(--ok); transition:width .15s"></div>
            </div>
            <span id="meterdb" class="muted" style="font-size:12px; min-width:56px; text-align:right">—</span>
          </div>
          <button class="btn small" id="listenbtn" style="margin-top:10px">▶ Listen live</button>
          <audio id="player" preload="none"></audio>
          <p class="muted" style="font-size:12px; margin:8px 0 0">Live audio lags a second or two behind the picture.</p>
        </div>
        <div class="card"><h2>Activity</h2><div class="log" id="log"></div></div>
      </div>
    </div>
  </section>

  <section class="tab" id="tab-events">
    <div style="display:flex; gap:8px; margin-bottom:12px">
      <select id="evfilter" style="max-width:200px">
        <option value="">All events</option><option value="person">People</option><option value="vehicle">Vehicles</option>
      </select>
      <button class="btn" id="evrefresh">Refresh</button>
    </div>
    <div class="events" id="events"></div>
  </section>

  <section class="tab" id="tab-recordings">
    <div class="card">
      <h2>Recordings</h2>
      <p class="muted" id="diskinfo"></p>
      <table><thead><tr><th>File</th><th>Modified</th><th>Size</th></tr></thead><tbody id="recs"></tbody></table>
    </div>
  </section>

  <section class="tab" id="tab-settings">
    <div class="settings">
      <div class="side" id="setnav"></div>
      <div class="card" id="setform">
        <div id="setbody"></div>
        <div class="savebar">
          <button class="btn primary" id="save">Save settings</button>
          <button class="btn" id="revert">Discard changes</button>
          <span class="muted" id="savemsg"></span>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const api = (url, opts) => fetch(url, opts).then(r => r.json());
const post = (url, body) => api(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3000); }

// ---------- tabs
$$("nav button").forEach(b => b.onclick = () => {
  $$("nav button").forEach(x => x.classList.toggle("active", x === b));
  $$("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  if (b.dataset.tab === "events") loadEvents();
  if (b.dataset.tab === "recordings") loadRecordings();
  if (b.dataset.tab === "settings") loadSettings();
});

// ---------- live status
let paused = false;
async function refreshStatus() {
  try {
    const s = await api("api/status");
    paused = s.paused;
    $("#audiocard").style.display = s.audio ? "block" : "none";
    if (s.audio) {
      const db = s.audio.level_db, pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100));
      $("#meter").style.width = pct + "%";
      $("#meter").style.background = db > -3 ? "var(--rec)" : db > -12 ? "var(--warn)" : "var(--ok)";
      $("#meterdb").textContent = db <= -100 ? "silent" : db.toFixed(0) + " dB";
    }
    if (document.activeElement !== $("#patrolchk")) $("#patrolchk").checked = !!s.patrol;
    $("#pausebtn").textContent = paused ? "Resume tracking" : "Pause tracking";
    $("#recdot").classList.toggle("rec", s.recording);
    $("#rectext").textContent = s.recording ? "REC" : (s.state || "idle");
    const rows = [
      ["State", s.state], ["Target", s.target || "—"],
      ["Pan / tilt", `${s.pan ?? "—"}° / ${s.tilt ?? "—"}°`], ["Zoom", s.zoom ? s.zoom + "×" : "—"],
      ["Processing", s.fps + " fps"], ["Recording", (s.recording ? "yes" : "no") + (s.encoder ? ` · ${s.encoder}` : "")],
      ["Storage", s.storage ? `${s.storage.used_gb} GB used · ${s.storage.free_gb} GB free` : "—"],
    ];
    if (s.last_event) rows.push(["Last capture", `${s.last_event.time.slice(11)} ${s.last_event.plate || s.last_event.label}`]);
    $("#status").innerHTML = rows.map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join("");
    $("#error").textContent = s.error ? "Error: " + s.error : "";
    $("#log").textContent = (s.log || []).slice().reverse().map(m => `${m.time.slice(11)}  ${m.msg}`).join("\n");
  } catch (e) { $("#rectext").textContent = "offline"; }
}
setInterval(refreshStatus, 1000); refreshStatus();
const ptzToast = { set_home: "Home position saved", set_patrol_left: "Patrol left edge saved", set_patrol_right: "Patrol right edge saved" };
$$("[data-ptz]").forEach(b => b.onclick = () => post("api/ptz", { action: b.dataset.ptz }).then(() => ptzToast[b.dataset.ptz] && toast(ptzToast[b.dataset.ptz])));
$("#patrolchk").onchange = async e => {
  const on = e.target.checked;
  const r = await post("api/settings", { patrol: { enabled: on } });
  if (r.ok) { if (on && paused) await post("api/ptz", { action: "home" }); toast(on ? "Patrol on" : "Patrol off"); }
  else { e.target.checked = !on; toast("Error: " + r.error); }
};
$("#listenbtn").onclick = () => {
  const p = $("#player");
  if (p.paused || !p.src) { p.src = "audio.wav?" + Date.now(); p.play(); $("#listenbtn").textContent = "■ Stop listening"; }
  else { p.pause(); p.removeAttribute("src"); p.load(); $("#listenbtn").textContent = "▶ Listen live"; }
};
$("#pausebtn").onclick = () => post("api/pause", { paused: !paused }).then(refreshStatus);

// ---------- events
async function loadEvents() {
  const kind = $("#evfilter").value;
  const evs = (await api("api/events?limit=120")).filter(e => !kind || e.kind === kind);
  $("#events").innerHTML = evs.length ? evs.map(e => {
    const f = e.files || {};
    const main = f.face || f.plate || f[e.kind] || f.scene;
    const thumbs = Object.entries(f).filter(([, p]) => p !== main)
      .map(([n, p]) => `<img src="captures/${esc(p)}" title="${esc(n)}" alt="${esc(n)}">`).join("");
    const plate = e.plate ? `<div style="margin-bottom:6px"><span class="plate">${esc(e.plate)}</span>
       <span class="muted">${e.plate_confirmed ? "confirmed" : "unconfirmed"} · ${Math.round((e.plate_conf || 0) * 100)}%</span></div>` : "";
    return `<div class="ev">${main ? `<img class="main" src="captures/${esc(main)}" alt="">` : ""}
      <div class="body">${plate}<strong>${esc(e.label)}</strong> <span class="muted">· ${esc(e.reason)}</span>
      <div class="muted">${esc(e.time.replace("T", " "))}</div><div class="thumbs">${thumbs}</div></div></div>`;
  }).join("") : `<p class="muted">No captures yet.</p>`;
}
$("#evfilter").onchange = loadEvents; $("#evrefresh").onclick = loadEvents;
document.addEventListener("click", e => {
  if (e.target.matches(".ev img")) { $("#lightbox img").src = e.target.src; $("#lightbox").style.display = "flex"; }
});
$("#lightbox").onclick = () => $("#lightbox").style.display = "none";

// ---------- recordings
async function loadRecordings() {
  const [recs, st] = await Promise.all([api("api/recordings"), api("api/status")]);
  $("#diskinfo").textContent = st.storage ? `${st.storage.used_gb} GB used by recordings · ${st.storage.free_gb} GB free of ${st.storage.disk_gb} GB` : "";
  $("#recs").innerHTML = recs.length ? recs.map(r => `<tr><td><a href="recordings/${esc(r.path)}" download>${esc(r.path)}</a></td>
    <td>${esc(r.modified)}</td><td>${r.size_mb} MB</td></tr>`).join("") : `<tr><td colspan="3" class="muted">No recordings yet.</td></tr>`;
}

// ---------- settings
let schema = [], values = {}, draft = {};
const getPath = (obj, path) => path.split(".").reduce((o, k) => o?.[k], obj);
function setPath(obj, path, v) { const ks = path.split("."); let o = obj; ks.slice(0, -1).forEach(k => o = o[k] ??= {}); o[ks.at(-1)] = v; }

async function loadSettings() {
  const r = await api("api/settings");
  schema = r.schema; values = r.values; draft = structuredClone(values);
  $("#setnav").innerHTML = schema.map((s, i) => `<button class="btn" data-sec="${i}">${esc(s.title)}</button>`).join("");
  $$("#setnav button").forEach(b => b.onclick = () => $("#sec-" + b.dataset.sec).scrollIntoView({ behavior: "smooth", block: "start" }));
  $("#setbody").innerHTML = schema.map((s, i) => `<h2 id="sec-${i}" style="margin-top:${i ? 24 : 0}px">${esc(s.title)}</h2>` +
    s.fields.map(renderField).join("")).join("");
  bindFields();
  $("#savemsg").textContent = "";
}

function renderField(f) {
  const id = "f_" + (Array.isArray(f.key) ? f.key[0] : f.key).replace(/\./g, "_");
  const restart = f.restart ? `<span class="tag" title="The camera/recorder restarts briefly when this changes">restart</span>` : "";
  const help = f.help ? `<div class="help">${esc(f.help)}</div>` : "";
  let input = "";
  if (f.type === "zones") return renderZones(f);
  if (f.type === "resolution") {
    const cur = `${getPath(draft, f.key[0])}x${getPath(draft, f.key[1])}`;
    const opts = f.options.includes(cur) ? f.options : [cur, ...f.options];
    input = `<select id="${id}">${opts.map(o => `<option ${o === cur ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  } else if (f.type === "select") {
    const cur = getPath(draft, f.key);
    const opts = f.options.map(String).includes(String(cur)) ? f.options : [cur, ...f.options];
    input = `<select id="${id}">${opts.map(o => `<option value="${esc(o)}" ${String(o) === String(cur) ? "selected" : ""}>${o === "" ? "auto" : esc(o)}</option>`).join("")}</select>`;
  } else if (f.type === "bool") {
    input = `<input type="checkbox" class="switch" id="${id}" ${getPath(draft, f.key) ? "checked" : ""}>`;
  } else if (f.type === "range") {
    const v = getPath(draft, f.key);
    const shown = f.invert ? +(f.min + f.max - v).toFixed(3) : v;
    input = `<div class="range-wrap"><input type="range" id="${id}" min="${f.min}" max="${f.max}" step="${f.step}" value="${shown}"><output>${v}</output></div>`;
  } else {
    const t = f.type === "number" ? "number" : f.type === "password" ? "password" : "text";
    const extra = f.type === "number" ? `min="${f.min}" max="${f.max}" step="${f.step}"` : "";
    input = `<input type="${t}" id="${id}" ${extra} value="${esc(getPath(draft, f.key))}">`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}${restart}</label>${input}${help}</div>`;
}

function bindFields() {
  schema.flatMap(s => s.fields).forEach(f => {
    if (f.type === "zones") return bindZones();
    const el = $("#f_" + (Array.isArray(f.key) ? f.key[0] : f.key).replace(/\./g, "_"));
    el.addEventListener("input", () => {
      if (f.type === "resolution") {
        const [w, h] = el.value.split("x").map(Number);
        setPath(draft, f.key[0], w); setPath(draft, f.key[1], h);
      } else if (f.type === "bool") setPath(draft, f.key, el.checked);
      else if (f.type === "range") {
        const v = +(f.invert ? (f.min + f.max - +el.value) : +el.value).toFixed(3);
        setPath(draft, f.key, v); el.nextElementSibling.textContent = v;
      } else if (f.type === "number") setPath(draft, f.key, el.value === "" ? 0 : +el.value);
      else if (f.type === "select") {
        const orig = getPath(values, f.key);
        setPath(draft, f.key, (typeof orig === "number" || f.options.every(o => typeof o === "number")) && el.value !== "" ? +el.value : el.value);
      } else {
        // camera.device may be an index or a path
        setPath(draft, f.key, f.key === "camera.device" && /^\d+$/.test(el.value) ? +el.value : el.value);
      }
      $("#savemsg").textContent = "Unsaved changes";
    });
  });
}

// zones editor: draw rectangles on a snapshot (normalised 0..1 coordinates)
let zoneMode = "ignore";
function renderZones(f) {
  return `<div class="field zones"><div><label>${esc(f.label)}</label><div class="help" style="grid-column:auto">${esc(f.help)}</div>
    <div class="zone-tools">
      <label><input type="radio" name="zmode" value="ignore" checked> Draw ignore zone</label>
      <label><input type="radio" name="zmode" value="watch"> Draw watch zone</label>
      <button class="btn small" id="zclear">Clear ignore zones</button>
      <button class="btn small" id="zreset">Reset watch zone</button>
      <button class="btn small" id="zsnap">New snapshot</button>
    </div>
    <div class="zone-wrap"><img id="zimg" src="snapshot.jpg?${Date.now()}" alt="Camera snapshot"><canvas id="zcanvas"></canvas></div></div></div>`;
}
function drawZones(tmp) {
  const c = $("#zcanvas"); if (!c) return;
  const r = c.getBoundingClientRect(); c.width = r.width; c.height = r.height;
  const g = c.getContext("2d"), W = c.width, H = c.height;
  const wz = draft.detection.watch_zone;
  g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0, 0, W, H);
  g.clearRect(wz[0] * W, wz[1] * H, (wz[2] - wz[0]) * W, (wz[3] - wz[1]) * H);
  g.strokeStyle = "#2fb872"; g.lineWidth = 2; g.strokeRect(wz[0] * W, wz[1] * H, (wz[2] - wz[0]) * W, (wz[3] - wz[1]) * H);
  for (const z of draft.detection.ignore_zones) {
    g.fillStyle = "rgba(229,72,77,.35)"; g.fillRect(z[0] * W, z[1] * H, (z[2] - z[0]) * W, (z[3] - z[1]) * H);
    g.strokeStyle = "#e5484d"; g.strokeRect(z[0] * W, z[1] * H, (z[2] - z[0]) * W, (z[3] - z[1]) * H);
  }
  if (tmp) { g.setLineDash([6, 4]); g.strokeStyle = "#fff"; g.strokeRect(tmp[0] * W, tmp[1] * H, (tmp[2] - tmp[0]) * W, (tmp[3] - tmp[1]) * H); }
}
function bindZones() {
  const c = $("#zcanvas"); let start = null;
  const pos = e => { const r = c.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e;
    return [Math.min(1, Math.max(0, (p.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (p.clientY - r.top) / r.height))]; };
  const box = (a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])].map(v => +v.toFixed(3));
  c.onpointerdown = e => { start = pos(e); c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (start) drawZones(box(start, pos(e))); };
  c.onpointerup = e => {
    if (!start) return; const b = box(start, pos(e)); start = null;
    if ((b[2] - b[0]) > 0.01 && (b[3] - b[1]) > 0.01) {
      if (zoneMode === "watch") draft.detection.watch_zone = b; else draft.detection.ignore_zones.push(b);
      $("#savemsg").textContent = "Unsaved changes";
    }
    drawZones();
  };
  $$("input[name=zmode]").forEach(r => r.onchange = () => zoneMode = r.value);
  $("#zclear").onclick = () => { draft.detection.ignore_zones = []; drawZones(); $("#savemsg").textContent = "Unsaved changes"; };
  $("#zreset").onclick = () => { draft.detection.watch_zone = [0, 0, 1, 1]; drawZones(); $("#savemsg").textContent = "Unsaved changes"; };
  $("#zsnap").onclick = () => $("#zimg").src = "snapshot.jpg?" + Date.now();
  $("#zimg").onload = () => drawZones();
  window.addEventListener("resize", () => drawZones());
  setTimeout(drawZones, 50);
}

$("#save").onclick = async () => {
  const r = await post("api/settings", draft);
  if (!r.ok) { $("#savemsg").textContent = "Error: " + r.error; return; }
  values = structuredClone(draft);
  $("#savemsg").textContent = r.changed.length ? `Saved ${r.changed.length} change(s)` + (r.restarted ? " — camera restarting…" : "") : "No changes";
  toast("Settings saved");
};
$("#revert").onclick = loadSettings;
</script>
